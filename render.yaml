services:
  - type: web
    name: spareparts-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev is required here: the NODE_ENV=production env var below applies during the
    # build step too, and npm's default behavior is to skip devDependencies (typescript, every
    # @types/* package) whenever NODE_ENV=production is set — even though tsc needs them to
    # compile. Without this flag the build fails with "Cannot find module 'express'" etc.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spareparts-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://spareparts-frontend.onrender.com
      - key: NODE_ENV
        value: production

  - type: web
    name: spareparts-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://spareparts-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: spareparts-db
    plan: free
